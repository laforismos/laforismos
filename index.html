<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAFORISMOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;500;600&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-02B0NJF559"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-02B0NJF559');
  </script>

  <style>
    body {
      --site-bg-color: #ff00b4;
      --mobile-overlay-opacity: 0.18;
      --site-text-color: white;
      --dynamic-box-border-color: rgba(255,255,255,0.6);
      --stamp-filter: brightness(0) invert(1);
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--site-text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--site-bg-color);
    }

    #bg-video {
      display: none !important;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: 126px 20px 20px;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    h1 {
      letter-spacing: 4px;
      margin: 0;
    }

    .site-header {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .site-title {
      margin: 0;
    }

    .site-title-link,
    .site-header-link,
    .sobre-foto-link {
      color: inherit;
      text-decoration: none;
    }

    .site-title-link,
    .sobre-foto-link {
      display: inline-block;
    }

    .site-header-link {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
    }

    .subtitulo {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.819rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.4px;
      text-align: right;
      margin: 0;
      opacity: 0.92;
      line-height: 1.05;
      max-width: min(38vw, 360px);
    }

    .box {
      position: relative;
      z-index: 1;
      border: 1px solid var(--dynamic-box-border-color);
      padding: 20px 30px;
      max-width: 90%;
      line-height: 1.4;
      cursor: pointer;
      overflow: hidden;
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(3px);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.08);
    }

    .box-proximo-tempo-btn {
      position: absolute;
      right: 14px;
      bottom: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: auto;
      height: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.9rem;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0.16em;
      cursor: default;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: auto;
      transition: opacity 0.26s ease, transform 0.26s ease;
      z-index: 3;
      user-select: none;
    }

    .box-proximo-tempo-btn.is-visible {
      opacity: 0.42;
      transform: translateY(0);
      pointer-events: none;
    }

    .box-proximo-tempo-btn:hover {
      opacity: 0.42;
    }

    body.sobre-aberto .box-proximo-tempo-btn,
    .box.is-loading .box-proximo-tempo-btn {
      opacity: 0 !important;
      transform: translateY(4px) !important;
      pointer-events: none !important;
    }

    .sobre-voltar-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      left: auto;
      display: none;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      color: inherit;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
      line-height: 1;
      font-weight: 400;
      cursor: pointer;
      opacity: 0.72;
      z-index: 3;
    }

    .sobre-voltar-btn:hover {
      opacity: 1;
    }

    .frase {
      font-family: "Bodoni Moda", "Times New Roman", serif;
      font-optical-sizing: auto;
      font-weight: 400;
      transition: opacity 0.3s ease;
      white-space: pre-line;
      display: block;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 0.01em;
      line-height: 1.5;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
      text-wrap: pretty;
    }

    .sobre-box-texto {
      font-family: "Bodoni Moda", "Times New Roman", serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.62;
      letter-spacing: 0.01em;
      white-space: pre-line;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
      text-wrap: pretty;
    }

    .sobre-box-texto strong {
      font-weight: 700;
    }

    .sobre-box-texto em {
      font-style: italic;
    }

    .frase strong {
      font-weight: 600;
    }

    .frase em {
      font-style: italic;
    }

    .frase-underline {
      text-decoration: underline;
      text-underline-offset: 0.08em;
    }

    .frase.dialogo {
      text-align: left !important;
      max-width: 620px;
      padding-left: 24px;
      padding-right: 24px;
      margin-left: auto;
      margin-right: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: white;
      color: black;
      display: flex;
      align-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .track {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      text-align: center;
    }

    .track span + span {
      display: none;
    }

    .loading-sizer {
      display: none;
      white-space: nowrap;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: lowercase;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      height: 0;
      overflow: hidden;
    }

    .box.is-loading {
      background: white;
      backdrop-filter: none;
      box-shadow: none;
      border-color: var(--dynamic-box-border-color);
    }

    .box.is-loading .frase {
      opacity: 0;
      pointer-events: none;
    }

    .box.is-loading .overlay {
      opacity: 1;
      pointer-events: none;
    }

    .box.is-loading .track {
      animation-duration: 6.4s;
    }

    .box.is-loading .loading-sizer {
      display: block;
    }

    .box.hover-preview:hover {
      background: white;
      backdrop-filter: none;
      box-shadow: none;
      border-color: var(--dynamic-box-border-color);
      transform: scale(1.012);
    }

    .box {
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    body.intro-click-mode:not(.sobre-aberto) .interacao-area .box {
      border-color: rgba(255,255,255,0.94);
      box-shadow:
        inset 0 0 12px rgba(255,255,255,0.08),
        0 0 0 0 rgba(255,255,255,0.28);
      animation: introClickPulse 1.9s ease-in-out infinite;
    }

    body.intro-click-mode:not(.sobre-aberto) .interacao-area .box:hover {
      transform: scale(1.015);
    }

    body.intro-click-mode:not(.sobre-aberto) .maquina-wrap {
      animation: maquinaHintPulse 1.9s ease-in-out infinite;
    }

    @keyframes introClickPulse {
      0% {
        transform: scale(1);
        box-shadow:
          inset 0 0 12px rgba(255,255,255,0.08),
          0 0 0 0 rgba(255,255,255,0.28);
      }
      50% {
        transform: scale(1.012);
        box-shadow:
          inset 0 0 12px rgba(255,255,255,0.08),
          0 0 0 14px rgba(255,255,255,0);
      }
      100% {
        transform: scale(1);
        box-shadow:
          inset 0 0 12px rgba(255,255,255,0.08),
          0 0 0 0 rgba(255,255,255,0);
      }
    }

    @keyframes maquinaHintPulse {
      0% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-2px); opacity: 0.92; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .box.hover-preview:hover .overlay {
      opacity: 1;
      background: white;
      pointer-events: none;
    }

    .box.hover-preview:hover .frase {
      opacity: 0;
    }

    .box.disable-hover:hover .overlay {
      opacity: 0;
    }

    .box.disable-hover:hover .frase {
      opacity: 1;
    }

    .box.is-loading.disable-hover:hover .overlay {
      opacity: 1;
    }

    .box.is-loading.disable-hover:hover .frase {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      body.intro-click-mode:not(.sobre-aberto) .interacao-area .box,
      body.intro-click-mode:not(.sobre-aberto) .maquina-wrap {
        animation: none;
      }

      .box.hover-preview:hover,
      body.intro-click-mode:not(.sobre-aberto) .interacao-area .box:hover {
        transform: none;
      }
    }


    .filtro-obceno {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
    }

    .filtro-apenas-novas {
      margin-top: 10px;
      align-self: center;
    }

    .interacao-area {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .sobre-trigger {
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 10px;
      display: inline-block;
    }

    .interacao-area .box,
    .interacao-area .filtro-obceno {
      transition: transform 0.42s ease, opacity 0.42s ease;
    }

    body.sobre-aberto .site-header {
      z-index: 0;
    }

    body.sobre-aberto .subtitulo {
      opacity: 0;
      transform: translateY(-90px);
      pointer-events: none;
    }

    .sobre-foto-link {
      position: relative;
      z-index: 3;
      border-radius: 999px;
    }

    .maquina-icones-slot {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 24px);
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      pointer-events: auto;
      touch-action: manipulation;
      user-select: none;
      z-index: 4;
      transition: opacity 0.38s ease, transform 0.52s cubic-bezier(0.16, 0.84, 0.22, 1);
      cursor: pointer;
    }

    .maquina-icone-reel {
      position: relative;
      width: 22px;
      height: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .maquina-icone-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      will-change: transform;
    }

    .maquina-icone-item {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .maquina-icone-item img {
      width: 15px;
      height: 15px;
      display: block;
      object-fit: contain;
      opacity: 0.96;
      filter: brightness(0) invert(1);
    }

    .maquina-icone-track.is-spinning {
      animation: maquinaIconeSpin 0.30s linear infinite;
    }

    @keyframes maquinaIconeSpin {
      from { transform: translateY(0); }
      to { transform: translateY(-130px); }
    }

    body.sobre-aberto .maquina-icones-slot {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(-6px);
    }

    
    .imagem-entre-sub-e-box {
      width: 106px;
      height: auto;
      display: block;
      opacity: 0.4;
      margin: 14px auto 14px;
      position: relative;
      z-index: 2;
      pointer-events: auto;
      user-select: none;
      cursor: pointer;
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
    }

    
    
    
    
    
    .maquina-wrap {
      position: relative;
      display: block;
      width: 106px;
      margin: 14px auto 14px;
      z-index: 2;
      transition: opacity 0.35s ease, transform 0.25s ease;
    }

    .maquina-wrap::before,
    .maquina-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("./maquina-de-escrever_BLACK.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      pointer-events: none;
      mix-blend-mode: normal;
      opacity: 0;
    }

    .imagem-entre-sub-e-box {
      width: 106px;
      height: auto;
      display: block;
      opacity: 1;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      pointer-events: auto;
      user-select: none;
      cursor: pointer;
      transition: opacity 3s linear, transform 0.14s ease, visibility 0.22s ease;
    }

    body.machine-initial .maquina-wrap,
    body.machine-initial .maquina-wrap::before,
    body.machine-initial .maquina-wrap::after,
    body.machine-initial .imagem-entre-sub-e-box {
      animation: none !important;
    }

    body.machine-initial .maquina-wrap::before,
    body.machine-initial .maquina-wrap::after {
      opacity: 0 !important;
      transform: none !important;
    }

    body.machine-initial .imagem-entre-sub-e-box {
      opacity: 1 !important;
      transform: translate(0, 0) scale(1) !important;
    }

    body.machine-settle .maquina-wrap,
    body.machine-settle .maquina-wrap::before,
    body.machine-settle .maquina-wrap::after,
    body.machine-settle .imagem-entre-sub-e-box {
      animation: none !important;
    }

    body.machine-settle .maquina-wrap::before,
    body.machine-settle .maquina-wrap::after {
      opacity: 0 !important;
      transform: none !important;
    }

    body.machine-settle .imagem-entre-sub-e-box {
      opacity: 0.35 !important;
      transform: translate(0, 0) scale(1) !important;
    }

    body.glitch-level-1 .maquina-wrap {
      animation: maquinaGlitchShake1 0.26s steps(2, end) infinite;
      filter: contrast(1.12) saturate(0.94);
    }

    body.glitch-level-1 .maquina-wrap::before {
      opacity: 0.34;
      animation: maquinaGlitchA1 0.13s steps(2, end) infinite;
      filter: blur(0.15px);
    }

    body.glitch-level-1 .maquina-wrap::after {
      opacity: 0.28;
      animation: maquinaGlitchB1 0.16s steps(2, end) infinite;
      filter: blur(0.20px);
    }

    body.glitch-level-1 .imagem-entre-sub-e-box {
      animation: maquinaGlitchCore1 0.11s steps(2, end) infinite;
    }

    body.glitch-level-2 .maquina-wrap {
      animation: maquinaGlitchShake2 0.18s steps(2, end) infinite;
      filter: contrast(1.18) saturate(0.92);
    }

    body.glitch-level-2 .maquina-wrap::before {
      opacity: 0.48;
      animation: maquinaGlitchA2 0.09s steps(2, end) infinite;
      filter: blur(0.20px);
    }

    body.glitch-level-2 .maquina-wrap::after {
      opacity: 0.38;
      animation: maquinaGlitchB2 0.11s steps(2, end) infinite;
      filter: blur(0.28px);
    }

    body.glitch-level-2 .imagem-entre-sub-e-box {
      animation: maquinaGlitchCore2 0.08s steps(2, end) infinite;
    }

    body.glitch-level-3 .maquina-wrap {
      animation: maquinaGlitchShake3 0.30s steps(2, end) infinite;
      filter: contrast(1.08) saturate(0.96);
    }

    body.glitch-level-3 .maquina-wrap::before {
      opacity: 0.30;
      animation: maquinaGlitchA3 0.16s steps(2, end) infinite;
      filter: blur(0.10px);
    }

    body.glitch-level-3 .maquina-wrap::after {
      opacity: 0.24;
      animation: maquinaGlitchB3 0.19s steps(2, end) infinite;
      filter: blur(0.15px);
    }

    body.glitch-level-3 .imagem-entre-sub-e-box {
      animation: maquinaGlitchCore3 0.14s steps(2, end) infinite;
    }

    body.glitch-paused .maquina-wrap,
    body.glitch-paused .maquina-wrap::before,
    body.glitch-paused .maquina-wrap::after,
    body.glitch-paused .imagem-entre-sub-e-box {
      animation-play-state: paused !important;
    }

    @keyframes maquinaGlitchA1 {
      0% { transform: translate(-5px, 2px); clip-path: inset(0 0 78% 0); }
      25% { transform: translate(4px, -2px); clip-path: inset(20% 0 46% 0); }
      50% { transform: translate(-4px, 2px); clip-path: inset(42% 0 22% 0); }
      75% { transform: translate(5px, 0); clip-path: inset(62% 0 8% 0); }
      100% { transform: translate(-5px, 2px); clip-path: inset(0 0 78% 0); }
    }

    @keyframes maquinaGlitchB1 {
      0% { transform: translate(5px, -2px); clip-path: inset(74% 0 0 0); }
      25% { transform: translate(-4px, 2px); clip-path: inset(14% 0 60% 0); }
      50% { transform: translate(4px, 0); clip-path: inset(36% 0 28% 0); }
      75% { transform: translate(-5px, 2px); clip-path: inset(58% 0 10% 0); }
      100% { transform: translate(5px, -2px); clip-path: inset(74% 0 0 0); }
    }

    @keyframes maquinaGlitchCore1 {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-2px, 0) scale(1.006); }
      66% { transform: translate(2px, -2px) scale(0.997); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes maquinaGlitchShake1 {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-2px, 0); }
      66% { transform: translate(2px, 0); }
      100% { transform: translate(0, 0); }
    }

    @keyframes maquinaGlitchA2 {
      0% { transform: translate(-6px, 2px); clip-path: inset(0 0 78% 0); }
      20% { transform: translate(5px, -2px); clip-path: inset(10% 0 58% 0); }
      40% { transform: translate(-6px, 2px); clip-path: inset(30% 0 34% 0); }
      60% { transform: translate(5px, -2px); clip-path: inset(48% 0 18% 0); }
      80% { transform: translate(-5px, 2px); clip-path: inset(66% 0 6% 0); }
      100% { transform: translate(-6px, 2px); clip-path: inset(0 0 78% 0); }
    }

    @keyframes maquinaGlitchB2 {
      0% { transform: translate(6px, -2px); clip-path: inset(74% 0 0 0); }
      20% { transform: translate(-5px, 2px); clip-path: inset(14% 0 60% 0); }
      40% { transform: translate(5px, 0); clip-path: inset(32% 0 30% 0); }
      60% { transform: translate(-6px, 2px); clip-path: inset(52% 0 14% 0); }
      80% { transform: translate(5px, -2px); clip-path: inset(66% 0 4% 0); }
      100% { transform: translate(6px, -2px); clip-path: inset(74% 0 0 0); }
    }

    @keyframes maquinaGlitchCore2 {
      0% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-2px, 2px) scale(1.010); }
      50% { transform: translate(2px, -2px) scale(0.995); }
      75% { transform: translate(-2px, 0) scale(1.012); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes maquinaGlitchShake2 {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 0); }
      50% { transform: translate(2px, 0); }
      75% { transform: translate(0, -1px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes maquinaGlitchA3 {
      0% { transform: translate(-4px, 2px); clip-path: inset(0 0 80% 0); }
      33% { transform: translate(4px, 0); clip-path: inset(22% 0 48% 0); }
      66% { transform: translate(-4px, 2px); clip-path: inset(54% 0 12% 0); }
      100% { transform: translate(-4px, 2px); clip-path: inset(0 0 80% 0); }
    }

    @keyframes maquinaGlitchB3 {
      0% { transform: translate(4px, -2px); clip-path: inset(76% 0 0 0); }
      33% { transform: translate(-4px, 2px); clip-path: inset(18% 0 58% 0); }
      66% { transform: translate(4px, 0); clip-path: inset(50% 0 14% 0); }
      100% { transform: translate(4px, -2px); clip-path: inset(76% 0 0 0); }
    }

    @keyframes maquinaGlitchCore3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-2px, 0) scale(1.004); }
      100% { transform: translate(0, 0) scale(1); }
    }

    body.sobre-aberto .maquina-wrap {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      height: 0;
      margin: 0;
      overflow: hidden;
    }



    .metalinguagem-carimbo {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 172px;
      height: auto;
      transform: translateX(-50%) scale(0.92);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 6;
      display: block;
      filter: var(--stamp-filter, brightness(0) saturate(100%));

function configurarTrechoDoVideo(bg) {
  const video = document.getElementById("bg-video");
  if (!video) return;

  if (videoTimeUpdateHandler) {
    video.removeEventListener("timeupdate", videoTimeUpdateHandler);
    videoTimeUpdateHandler = null;
  }

  if (videoLoadedMetadataHandler) {
    video.removeEventListener("loadedmetadata", videoLoadedMetadataHandler);
    videoLoadedMetadataHandler = null;
  }

  const temTrechoCustomizado =
    Number.isFinite(bg?.startTime) &&
    Number.isFinite(bg?.endTime) &&
    bg.endTime > bg.startTime;

  if (!temTrechoCustomizado) {
    video.loop = true;
    return;
  }

  video.loop = false;

  videoLoadedMetadataHandler = () => {
    try {
      if (video.currentTime < bg.startTime || video.currentTime >= bg.endTime) {
        video.currentTime = bg.startTime;
      }
    } catch (e) {}
  };

  videoTimeUpdateHandler = () => {
    if (video.currentTime >= bg.endTime) {
      video.currentTime = bg.startTime;
      const tentativa = video.play();
      if (tentativa && typeof tentativa.catch === "function") {
        tentativa.catch(() => {});
      }
    }
  };

  video.addEventListener("loadedmetadata", videoLoadedMetadataHandler);
  video.addEventListener("timeupdate", videoTimeUpdateHandler);
}

const SESSION_RANDOM_SEED = (() => {
  try {
    const bytes = new Uint32Array(1);
    crypto.getRandomValues(bytes);
    return bytes[0] || Date.now();
  } catch (e) {
    return (Date.now() ^ Math.floor(Math.random() * 2147483647)) >>> 0;

})();

let sessionShuffleCounter = 0;

function criarGeradorPseudoaleatorio(seedBase) {
  let estado = (seedBase >>> 0) || 1;
  return function() {
    estado = (estado * 1664525 + 1013904223) >>> 0;
    return estado / 4294967296;
  };
}

function embaralhar(array, extraSeed = 0) {
  const copia = Array.isArray(array) ? [...array] : [];
  const random = criarGeradorPseudoaleatorio(
    (SESSION_RANDOM_SEED + (++sessionShuffleCounter * 1013904223) + (extraSeed >>> 0)) >>> 0
  );

  for (let i = copia.length - 1; i > 0; i -= 1) {
    const j = Math.floor(random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function medirAlturaConteudo(el) {
  if (!el) return 0;
  const displayAnterior = el.style.display;
  const visibilityAnterior = el.style.visibility;
  const positionAnterior = el.style.position;
  const leftAnterior = el.style.left;
  const widthAnterior = el.style.width;

  const estilos = window.getComputedStyle(el);
  const precisaMostrar = estilos.display === "none";

  if (precisaMostrar) {
    el.style.display = "block";
    el.style.visibility = "hidden";
    el.style.position = "absolute";
    el.style.left = "-9999px";
    el.style.width = estilos.width;
  }

  const altura = el.scrollHeight;

  if (precisaMostrar) {
    el.style.display = displayAnterior;
    el.style.visibility = visibilityAnterior;
    el.style.position = positionAnterior;
    el.style.left = leftAnterior;
    el.style.width = widthAnterior;
  }

  return altura;
}

function ajustarAlturaBoxDinamicamente() {
  const box = document.getElementById("box");
  const fraseEl = document.getElementById("frase");
  const sobreEl = document.getElementById("sobreBoxTexto");
  if (!box || !fraseEl || !sobreEl) return;

  const estaNoDesktop = window.matchMedia("(min-width: 769px)").matches;

  box.style.height = "auto";

  if (!estaNoDesktop) {
    box.style.width = "";
    box.style.height = "";
    return;
  }

  const conteudoAtivo = sobreAberto ? sobreEl : fraseEl;
  const conteudoInativo = sobreAberto ? fraseEl : sobreEl;
  if (!conteudoAtivo) return;

  const boxStyles = window.getComputedStyle(box);
  const paddingX = parseFloat(boxStyles.paddingLeft) + parseFloat(boxStyles.paddingRight);
  const borderX = parseFloat(boxStyles.borderLeftWidth) + parseFloat(boxStyles.borderRightWidth);
  const larguraMaximaBox = Math.min(window.innerWidth * 0.9, 760);
  const larguraMaximaConteudo = Math.max(0, larguraMaximaBox - paddingX - borderX);

  const displayConteudoAtivoAnterior = conteudoAtivo.style.display;
  const visibilityConteudoAtivoAnterior = conteudoAtivo.style.visibility;
  const positionConteudoAtivoAnterior = conteudoAtivo.style.position;
  const leftConteudoAtivoAnterior = conteudoAtivo.style.left;
  const widthConteudoAtivoAnterior = conteudoAtivo.style.width;
  const maxWidthConteudoAtivoAnterior = conteudoAtivo.style.maxWidth;

  const displayConteudoInativoAnterior = conteudoInativo ? conteudoInativo.style.display : "";

  if (conteudoInativo) {
    conteudoInativo.style.display = "none";
  }

  conteudoAtivo.style.display = "inline-block";
  conteudoAtivo.style.visibility = "hidden";
  conteudoAtivo.style.position = "absolute";
  conteudoAtivo.style.left = "-9999px";
  conteudoAtivo.style.width = "auto";
  conteudoAtivo.style.maxWidth = larguraMaximaConteudo + "px";

  box.style.width = "auto";
  const larguraConteudo = Math.min(conteudoAtivo.offsetWidth || conteudoAtivo.scrollWidth || 0, larguraMaximaConteudo);
  const larguraFinalBox = Math.min(larguraMaximaBox, Math.ceil(larguraConteudo + paddingX + borderX));

  conteudoAtivo.style.display = displayConteudoAtivoAnterior;
  conteudoAtivo.style.visibility = visibilityConteudoAtivoAnterior;
  conteudoAtivo.style.position = positionConteudoAtivoAnterior;
  conteudoAtivo.style.left = leftConteudoAtivoAnterior;
  conteudoAtivo.style.width = widthConteudoAtivoAnterior;
  conteudoAtivo.style.maxWidth = maxWidthConteudoAtivoAnterior;

  if (conteudoInativo) {
    conteudoInativo.style.display = displayConteudoInativoAnterior;
  }

  box.style.width = Math.max(0, larguraFinalBox) + "px";
  box.style.height = "auto";
}

function parsePartesComTempos(partesOriginais) {
  const caracteres = [];
  const pilhaEtapas = [1];

  function etapaAtualDaPilha() {
    return pilhaEtapas[pilhaEtapas.length - 1] || 1;
  }

  function removerUltimaOcorrenciaDaEtapa(etapa) {
    for (let i = pilhaEtapas.length - 1; i >= 1; i -= 1) {
      if (pilhaEtapas[i] === etapa) {
        pilhaEtapas.splice(i, 1);
        break;
      }
    }
  }

  for (const parte of (partesOriginais || [])) {
    const texto = String(parte?.texto || "");

    for (const ch of texto) {
      if (ch === "[") {
        pilhaEtapas.push(2);
        continue;
      }
      if (ch === "]") {
        removerUltimaOcorrenciaDaEtapa(2);
        continue;
      }
      if (ch === "{") {
        pilhaEtapas.push(3);
        continue;
      }
      if (ch === "}") {
        removerUltimaOcorrenciaDaEtapa(3);
        continue;
      }
      if (ch === "*") {
        if (etapaAtualDaPilha() === 4) {
          removerUltimaOcorrenciaDaEtapa(4);
        } else {
          pilhaEtapas.push(4);
        }
        continue;
      }
      if (ch === "\\") {
        if (etapaAtualDaPilha() === 5) {
          removerUltimaOcorrenciaDaEtapa(5);
        } else {
          pilhaEtapas.push(5);
        }
        continue;
      }

      caracteres.push({
        texto: ch,
        etapa: etapaAtualDaPilha(),
        bold: !!parte?.bold,
        italic: !!parte?.italic,
        underline: !!parte?.underline
      });
    }
  }

  const resultado = [];

  for (const caractere of caracteres) {
    const ultima = resultado[resultado.length - 1];

    if (
      ultima &&
      ultima.etapa === caractere.etapa &&
      ultima.bold === caractere.bold &&
      ultima.italic === caractere.italic &&
      ultima.underline === caractere.underline
    ) {
      ultima.texto += caractere.texto;
    } else {
      resultado.push({
        texto: caractere.texto,
        etapa: caractere.etapa,
        bold: caractere.bold,
        italic: caractere.italic,
        underline: caractere.underline
      });
    }
  }

  return resultado;
}

function maiorEtapa(partes) {
  if (!Array.isArray(partes) || partes.length === 0) return 1;
  return partes.reduce((maximo, parte) => Math.max(maximo, parte.etapa || 1), 1);
}

function obterProximaEtapaDisponivel(partes, etapaAtualValor = 1) {
  const etapas = [...new Set((partes || []).map(parte => parte.etapa || 1))]
    .sort((a, b) => a - b);

  const htmlAtual = montarHtmlPartes(partes || [], etapaAtualValor);

  for (const etapa of etapas) {
    if (etapa <= etapaAtualValor) continue;

    const htmlNovo = montarHtmlPartes(partes || [], etapa);
    if (htmlNovo !== htmlAtual) {
      return etapa;
    }
  }

  return null;
}

function aplicarFormatacao(parte) {
  let texto = escaparHtml(parte.texto || "");

  if (parte.underline) {
    texto = `<span class="frase-underline">${texto}</span>`;
  }
  if (parte.italic) {
    texto = `<em>${texto}</em>`;
  }
  if (parte.bold) {
    texto = `<strong>${texto}</strong>`;
  }

  return texto;
}

function montarHtmlPartes(partes, etapaMaxima = 1) {
  return (partes || [])
    .filter(parte => (parte.etapa || 1) <= etapaMaxima)
    .map(aplicarFormatacao)
    .join("");
}

function obterTextoVisivel(partes, etapaMaxima = 1) {
  return (partes || [])
    .filter(parte => (parte.etapa || 1) <= etapaMaxima)
    .map(parte => parte.texto || "")
    .join("")
    .trim();
}

function obterTextoDaEtapa(partes, etapaDesejada = 1) {
  return (partes || [])
    .filter(parte => (parte.etapa || 1) === etapaDesejada)
    .map(parte => parte.texto || "")
    .join("")
    .trim();
}

function recomporFilaPreservandoAtual() {
  atualizarFrasesFiltradas();

  const atualId = fraseAtual?.id ?? null;
  const idsPermitidos = new Set(
    frasesFiltradas
      .filter(item => item?.id != null && item.id !== atualId)
      .map(item => item.id)
  );

  const pendentes = frasesFiltradas.filter(item => {
    if (item?.id == null) return false;
    if (item.id === atualId) return false;
    if (idsExibidos.has(item.id)) return false;
    return true;
  });

  const filaPermitida = fila.filter(item => item?.id != null && idsPermitidos.has(item.id));
  const idsNaFila = new Set(filaPermitida.map(item => item.id));

  const faltantes = embaralhar(
    pendentes.filter(item => !idsNaFila.has(item.id)),
    pendentes.length + idsExibidos.size
  );

  fila = [...filaPermitida, ...faltantes];

  const aindaFaltam = frasesFiltradas.some(item => item?.id != null && item.id !== atualId && !idsExibidos.has(item.id));
  acabou = !aindaFaltam && fila.length === 0;

  debugFrases("fila recomposta", {
    fraseAtual: atualId,
    pendentes: pendentes.map(item => item?.id).filter(id => id != null),
    novaFila: fila.map(item => item?.id).filter(id => id != null),
    acabou
  });
}

function calcularTempoLeitura(texto) {
  const textoLimpo = String(texto || "").trim();

  if (!textoLimpo) return 5000;

  const linhas = textoLimpo
    .split("\n")
    .map(l => l.trim())
    .filter(Boolean);

  const palavras = textoLimpo.split(/\s+/).filter(Boolean).length;
  const qtdLinhas = linhas.length;

  const pontuacaoForte = (textoLimpo.match(/[.!?…:;]/g) || []).length;
  const virgulas = (textoLimpo.match(/,/g) || []).length;
  const travessoesDeDialogo = (textoLimpo.match(/(^|\n)\s*[-–—]\s+/g) || []).length;

  const ehDialogo = travessoesDeDialogo > 0;

  const tempoBase = 2200;
  const msPorPalavra = 340;
  const msPorLinhaExtra = 850;
  const msPontuacaoForte = 180;
  const msVirgula = 90;
  const bonusDialogo = 1200;

  let tempo =
    tempoBase +
    (palavras * msPorPalavra) +
    (Math.max(0, qtdLinhas - 1) * msPorLinhaExtra) +
    (pontuacaoForte * msPontuacaoForte) +
    (virgulas * msVirgula);

  if (ehDialogo) {
    tempo += bonusDialogo;
  }

  const tempoMin = 4500;
  const tempoMax = 18000;

  return Math.max(tempoMin, Math.min(tempo, tempoMax));
}

function aplicarTravaHoverParaEstadoAtual(fraseObj, etapa, aoEntrarNovaFrase = false) {
  const etapaFinal = maiorEtapa(fraseObj?.partes || []);

  if (etapa < etapaFinal) {
    travarHoverSemTempo();
    return;
  }

  if (etapaFinal > 1 && !aoEntrarNovaFrase) {
    const textoReveladoPorUltimo = obterTextoDaEtapa(fraseObj?.partes || [], etapaFinal);
    travarHoverConformeTexto(textoReveladoPorUltimo || obterTextoVisivel(fraseObj?.partes || [], etapaFinal));
    return;
  }

  const textoVisivel = obterTextoVisivel(fraseObj?.partes || [], etapa);
  travarHoverConformeTexto(textoVisivel);
}

    travarHoverConformeTexto(mensagemVazia);

  if (fila.length === 0) {
    recomporFilaPreservandoAtual();

  if (fila.length === 0) {
    acabou = true;
    mostrarMensagem("Por enquanto é isso aí.");
    travarHoverConformeTexto("Por enquanto é isso aí.");

  acabou = false;

function definirObceno(novoValor) {

  if (mostrarObcenas === valorNormalizado) {
    sincronizarToggle();

  }

  const estavaLigado = mostrarObcenas;
  mostrarObcenas = valorNormalizado;

  recomporFilaPreservandoAtual();

  const desligouFiltro = estavaLigado && !mostrarObcenas;

  if (desligouFiltro && fraseAtualEhObscena) {

}

function inicializarInteracaoToggleIndividual(idBotao, obterValorAtual, definirValor, alternarValor) {
  const botao = document.getElementById(idBotao);
  if (!botao) return;

  let pointerIdAtivo = null;
  let arrastando = false;
  let houveMovimento = false;
  let inicioX = 0;

  const limiar = 12;

  function encerrarArraste() {
    arrastando = false;
    pointerIdAtivo = null;
    botao.classList.remove("dragging");
  }

  function bloquearEvento(event) {
    event.stopPropagation();
  }

  botao.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
  });

  botao.addEventListener("mousedown", bloquearEvento);
  botao.addEventListener("mouseup", bloquearEvento);
  botao.addEventListener("touchstart", bloquearEvento, { passive: true });
  botao.addEventListener("touchend", bloquearEvento);
  botao.addEventListener("touchcancel", bloquearEvento);

  botao.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    event.stopPropagation();
    pointerIdAtivo = event.pointerId;
    arrastando = true;
    houveMovimento = false;
    inicioX = event.clientX;
    botao.classList.add("dragging");

    if (botao.setPointerCapture) {
      try { botao.setPointerCapture(event.pointerId); } catch (e) {}
    }
  });

  botao.addEventListener("pointermove", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (!arrastando || event.pointerId !== pointerIdAtivo) return;

    const deltaX = event.clientX - inicioX;

    if (Math.abs(deltaX) >= limiar) {
      houveMovimento = true;
    }

    if (deltaX > limiar) {
      definirValor(true);
    } else if (deltaX < -limiar) {
      definirValor(false);
    } else {
      sincronizarToggleIndividual(idBotao, obterValorAtual());
    }
  });

  botao.addEventListener("pointerup", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (event.pointerId !== pointerIdAtivo) return;

    if (!houveMovimento) {
      alternarValor();
    }

    encerrarArraste();
  });

  botao.addEventListener("pointercancel", (event) => {
    event.preventDefault();
    event.stopPropagation();
    encerrarArraste();
  });

  botao.addEventListener("lostpointercapture", () => {
    encerrarArraste();
  });
}

function inicializarInteracaoToggle() {

  );

function normalizarBoolean(valor) {
  if (typeof valor === "boolean") return valor;
  if (typeof valor === "number") return valor === 1;

  if (valor && typeof valor === "object") {
    if ("value" in valor) return normalizarBoolean(valor.value);
    if ("booleanValue" in valor) return normalizarBoolean(valor.booleanValue);
    if ("boolValue" in valor) return normalizarBoolean(valor.boolValue);
    if ("underlined" in valor) return normalizarBoolean(valor.underlined);
    if ("underline" in valor) return normalizarBoolean(valor.underline);
    if ("textDecoration" in valor) return normalizarBoolean(valor.textDecoration);
  }

  const v = String(valor ?? "").trim().toLowerCase();
  return (
    v === "true" ||
    v === "verdadeiro" ||
    v === "1" ||
    v === "sim" ||
    v === "underline" ||
    v === "underlined" ||
    v === "single" ||
    v === "solid"
  );
}

function procurarUnderlineRecursivo(valor, profundidade = 0) {
  if (profundidade > 4 || valor == null) return false;

  if (typeof valor !== "object") {
    return normalizarBoolean(valor);
  }

  const entradas = Array.isArray(valor)
    ? valor.map((item, index) => [String(index), item])
    : Object.entries(valor);

  for (const [chave, conteudo] of entradas) {
    const chaveNormalizada = String(chave || "").toLowerCase();

    if (
      chaveNormalizada.includes("underline") ||
      chaveNormalizada.includes("underlined") ||
      chaveNormalizada.includes("sublinh") ||
      chaveNormalizada.includes("textdecoration")
    ) {
      if (normalizarBoolean(conteudo)) return true;
      if (conteudo && typeof conteudo === "object" && procurarUnderlineRecursivo(conteudo, profundidade + 1)) {
        return true;
      }
    }

    if (conteudo && typeof conteudo === "object") {
      if (procurarUnderlineRecursivo(conteudo, profundidade + 1)) return true;
    }
  }

  return false;
}

function normalizarMarcacaoUnderline(parte) {
  const valorDireto =
    parte?.underline ??
    parte?.underlined ??
    parte?.sublinhado ??
    parte?.sublinhada ??
    parte?.textUnderline ??
    parte?.isUnderline ??
    parte?.format?.underline ??
    parte?.format?.underlined ??
    parte?.style?.underline ??
    parte?.style?.underlined ??
    parte?.textFormat?.underline ??
    parte?.textStyle?.underline ??
    parte?.textStyle?.underlined ??
    parte?.textFormat?.textDecoration ??
    parte?.textStyle?.textDecoration;

  if (valorDireto != null && normalizarBoolean(valorDireto)) {
    return true;
  }

  return procurarUnderlineRecursivo(parte);
}

function normalizarPartes(partes) {
  return parsePartesComTempos(
    (partes || [])
      .map(parte => ({
        texto: String(parte?.texto ?? parte?.text ?? ""),
        bold: normalizarBoolean(
          parte?.bold ??
          parte?.negrito ??
          parte?.format?.bold ??
          parte?.style?.bold ??
          parte?.textFormat?.bold ??
          false
        ),
        italic: normalizarBoolean(
          parte?.italic ??
          parte?.italico ??
          parte?.itálico ??
          parte?.format?.italic ??
          parte?.style?.italic ??
          parte?.textFormat?.italic ??
          false
        ),
        underline: normalizarMarcacaoUnderline(parte)
      }))
      .filter(parte => parte.texto !== "")
  );
}

let sobreTransicaoTravadaAte = 0;
const BLOQUEIO_TRANSICAO_SOBRE_MS = 320;

function obterIndiceFallbackSobreAtual() {
  try {
    const indiceSalvo = Number(localStorage.getItem(STORAGE_SOBRE_FALLBACK_INDICE) || "0");
    const indiceAtual = Number.isFinite(indiceSalvo) ? indiceSalvo : 0;
    return ((indiceAtual % FALLBACKS_SOBRE.length) + FALLBACKS_SOBRE.length) % FALLBACKS_SOBRE.length;
  } catch (e) {
    return 0;
  }
}

function obterFallbackSobreAtual() {
  fallbackSobreAtualIndice = obterIndiceFallbackSobreAtual();
  return FALLBACKS_SOBRE[fallbackSobreAtualIndice] || FALLBACKS_SOBRE[0];
}

function avancarFallbackSobre() {
  try {
    const proximoIndice = (fallbackSobreAtualIndice + 1) % FALLBACKS_SOBRE.length;
    fallbackSobreAtualIndice = proximoIndice;
    localStorage.setItem(STORAGE_SOBRE_FALLBACK_INDICE, String(proximoIndice));
  } catch (e) {}
}

function textoSobreParaPartes(texto) {
  const textoNormalizado = String(texto || "").trim();
  if (!textoNormalizado) return null;
  return [{ texto: textoNormalizado, bold: false, italic: false, underline: false }];
}

function definirSobreApiOuFallback(sobreTexto) {
  partesSobreApi = textoSobreParaPartes(sobreTexto);
  partesSobreAtuais = partesSobreApi || FALLBACKS_SOBRE[0];
  sobreAbertoComFallbackSequencial = false;
  renderizarSobre();
}

function prepararConteudoSobre(origem = "geral") {
  if (partesSobreApi) {
    partesSobreAtuais = partesSobreApi;
    sobreAbertoComFallbackSequencial = false;
  } else if (origem === "footer") {
    partesSobreAtuais = obterFallbackSobreAtual();
    sobreAbertoComFallbackSequencial = true;
  } else {
    partesSobreAtuais = partesSobreAtuais || FALLBACKS_SOBRE[0];
    sobreAbertoComFallbackSequencial = false;
  }

  renderizarSobre();
}

function renderizarSobre() {
  const el = document.getElementById("sobreBoxTexto");
  if (!el) return;
  el.innerHTML = montarHtmlPartes(partesSobreAtuais || FALLBACKS_SOBRE[0], 99);
}
function abrirSobre() {
  sobreAberto = true;
  desativarMetalinguagemVisual();
  document.body.classList.add("sobre-aberto");
  document.body.classList.remove("machine-initial");
  pararGlitchDaMaquina();
  pausarIconesDaMaquina();

  const ehMobile = window.matchMedia("(max-width: 768px)").matches;
  const htmlEl = document.documentElement;
  const boxEl = document.getElementById("box");
  const fraseEl = document.getElementById("frase");
  const sobreEl = document.getElementById("sobreBoxTexto");
  const overlayEl = document.querySelector(".overlay");

  if (ehMobile) {
    htmlEl.classList.add("sobre-mobile-lock");
    document.body.classList.add("sobre-mobile-lock");
    htmlEl.style.overflowX = "hidden";
    document.body.style.overflowX = "hidden";
  }

  if (boxEl) {
    boxEl.classList.remove("is-loading", "backend-waiting", "backend-ready", "disable-hover");
    boxEl.style.background = "rgba(255,255,255,0.80)";
    boxEl.style.border = "none";
  }

  if (fraseEl) {
    fraseEl.style.display = "none";
  }

  if (overlayEl) {
    overlayEl.style.display = "none";
  }

  if (sobreEl) {
    sobreEl.style.display = "block";
    sobreEl.style.visibility = "visible";
    sobreEl.style.opacity = "1";
    sobreEl.style.position = "relative";
  }

  resetarDimensoesDoBox();
  ajustarAlturaBoxDinamicamente();
  atualizarBotaoProximoTempo(null, 1);
  iniciarGlitchDaMaquina();
}

function fecharSobre(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (!sobreAberto) return;

  travarTransicaoSobre();

  const deveAvancarFallback = !partesSobreApi && sobreAbertoComFallbackSequencial;

  sobreAberto = false;
  document.body.classList.remove("sobre-aberto");

  const ehMobile = window.matchMedia("(max-width: 768px)").matches;
  const htmlEl = document.documentElement;
  const fraseEl = document.getElementById("frase");
  const sobreEl = document.getElementById("sobreBoxTexto");
  const overlayEl = document.querySelector(".overlay");

  if (ehMobile) {
    htmlEl.classList.remove("sobre-mobile-lock");
    document.body.classList.remove("sobre-mobile-lock");
    htmlEl.style.overflowX = "";
    document.body.style.overflowX = "";
  }

  if (sobreEl) {
    sobreEl.style.display = "none";
    sobreEl.style.visibility = "";
    sobreEl.style.opacity = "";
    sobreEl.style.position = "";
  }

  if (deveAvancarFallback) {
    avancarFallbackSobre();
  }

  sobreAbertoComFallbackSequencial = false;

  if (fraseEl) fraseEl.style.display = "block";
  if (overlayEl) overlayEl.style.display = "";
  const boxEl = document.getElementById("box");
  if (boxEl) {
    boxEl.style.background = "";
    boxEl.style.backgroundColor = "";
    boxEl.style.border = "";
  }
  resetarDimensoesDoBox();
  ajustarAlturaBoxDinamicamente();
  atualizarBotaoProximoTempo(fraseAtual, etapaAtual);
  if (document.getElementById("box")?.classList.contains("is-loading") && !document.body.classList.contains("machine-settle")) {
    iniciarGlitchDaMaquina();
  }
  iniciarIconesDaMaquina();
}

function inicializarAtalhosDoSobre() {
  const headerLink = document.querySelector(".site-header-link");
  if (headerLink) {
    headerLink.addEventListener("click", (event) => {
      if (!sobreAberto) return;
      fecharSobre(event);
    });
  }
}

function sobreTransicaoEstaTravada() {
  return Date.now() < sobreTransicaoTravadaAte;
}

function travarTransicaoSobre() {
  sobreTransicaoTravadaAte = Date.now() + BLOQUEIO_TRANSICAO_SOBRE_MS;
}

function toggleSobre(event, origem = "geral") {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (sobreTransicaoEstaTravada()) {
    return;
  }

  travarTransicaoSobre();

  if (sobreAberto) {
    fecharSobre();
  } else {
    prepararConteudoSobre(origem);
    abrirSobre();
  }
}

function inicializarInteracaoBox() {
  const box = document.getElementById("box");
  if (!box) return;

  let pointerIdAtivo = null;
  let inicioX = 0;
  let inicioY = 0;
  let ignorarProximoClick = false;
  let toqueInicioX = 0;
  let toqueInicioY = 0;
  let ultimoGestoMobileTs = 0;

  const limiarSwipe = 18;
  const janelaAntiDuploDisparoMs = 450;

  function ehMobile() {
    return window.matchMedia("(max-width: 768px)").matches;
  }

  function registrarGestoMobile() {
    ultimoGestoMobileTs = Date.now();
  }

  function houveGestoMobileRecente() {
    return (Date.now() - ultimoGestoMobileTs) < janelaAntiDuploDisparoMs;
  }

  function processarDeslizamento(deltaX, deltaY) {
    const distancia = Math.hypot(deltaX, deltaY);

    if (ehMobile() && distancia >= limiarSwipe) {
      ignorarProximoClick = true;
      registrarGestoMobile();
      proximaFrase();
      return true;
    }

    return false;
  }

  box.addEventListener("click", (event) => {
    if (event.target.closest(".sobre-voltar-btn")) return;
    if (sobreAberto) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    if (event.target.closest(".toggle-btn")) return;

    if (ignorarProximoClick || (ehMobile() && houveGestoMobileRecente())) {
      event.preventDefault();
      ignorarProximoClick = false;
      return;
    }

    proximaFrase();
  });

  box.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".sobre-voltar-btn")) return;
    if (sobreAberto) return;
    if (event.target.closest(".toggle-btn")) return;
    if (ehMobile() && event.pointerType === "touch") return;

    pointerIdAtivo = event.pointerId;
    inicioX = event.clientX;
    inicioY = event.clientY;

    if (box.setPointerCapture) {
      try { box.setPointerCapture(event.pointerId); } catch (e) {}
    }
  });

  box.addEventListener("pointerup", (event) => {
    if (ehMobile() && event.pointerType === "touch") return;
    if (event.pointerId !== pointerIdAtivo) return;

    const deltaX = event.clientX - inicioX;
    const deltaY = event.clientY - inicioY;

    pointerIdAtivo = null;

    if (processarDeslizamento(deltaX, deltaY)) {
      event.preventDefault();
    }
  });

  box.addEventListener("pointercancel", () => {
    pointerIdAtivo = null;
  });

  box.addEventListener("touchstart", (event) => {
    if (event.target.closest(".sobre-voltar-btn")) return;
    if (sobreAberto) return;
    if (!ehMobile()) return;
    if (event.target.closest(".toggle-btn")) return;
    const toque = event.changedTouches[0];
    if (!toque) return;
    toqueInicioX = toque.clientX;
    toqueInicioY = toque.clientY;
  }, { passive: true });

  box.addEventListener("touchend", (event) => {
    if (sobreAberto) return;
    if (!ehMobile()) return;
    if (event.target.closest(".toggle-btn")) return;
    const toque = event.changedTouches[0];
    if (!toque) return;

    const deltaX = toque.clientX - toqueInicioX;
    const deltaY = toque.clientY - toqueInicioY;

    if (processarDeslizamento(deltaX, deltaY)) {
      event.preventDefault();
    }
  });
}

async function carregarFrasesDaApi() {
  try {
    ativarEstadoLoadingBox();

    const response = await fetch(API_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Falha ao acessar a API: " + response.status);
    }

    const data = await response.json();

    if (!data?.ok || !Array.isArray(data.frases)) {
      throw new Error("Resposta inválida da API.");
    }

    const frasesNormalizadas = data.frases
      .map((item, index) => ({
        id: index + 1,
        partes: normalizarPartes(item.partes),
        obceno: normalizarBoolean(item.obceno),
        metalinguagem: normalizarBoolean(
          item?.metalinguagem ??
          item?.metaLinguagem ??
          item?.meta_linguagem
        )
      }));

    definirSobreApiOuFallback(data.sobreTexto);

    const frasesDescartadas = frasesNormalizadas
      .filter(item => item.partes.length === 0)
      .map(item => item.id);

    frases = frasesNormalizadas.filter(item => item.partes.length > 0);

    debugFrases("API carregada", {
      totalRecebidas: Array.isArray(data.frases) ? data.frases.length : 0,
      totalValidas: frases.length,
      idsDescartados: frasesDescartadas
    });

    iniciar();

  } catch (e) {
    console.error(e);
    ativarEstadoLoadingBox();
  }
}

const MAQUINA_REEL_ITEM_SIZE = 22;
const MAQUINA_REEL_ITEM_SIZE_MOBILE = 16;
const MAQUINA_REEL_REPEAT = 4;
let maquinaIconesInicializados = false;
let maquinaIconesSpinning = false;
let maquinaIconesTimeout = null;
let maquinaIconesCombinacaoAtual = [0, 1, 2];

function obterTamanhoAtualDoReel() {
  return window.matchMedia("(max-width: 768px)").matches
    ? MAQUINA_REEL_ITEM_SIZE_MOBILE
    : MAQUINA_REEL_ITEM_SIZE;
}

function obterTranslateYAtual(el) {
  const transform = window.getComputedStyle(el).transform;
  if (!transform || transform === "none") return 0;
  try {
    const matrix = new DOMMatrixReadOnly(transform);
    return matrix.m42;
  } catch (e) {
    const match = transform.match(/matrix\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*([^\)]+)\)/);
    return match ? Number(match[1]) || 0 : 0;
  }
}

function preencherTracksDosIcones() {
  const tracks = document.querySelectorAll(".maquina-icone-track");
  tracks.forEach((track) => {
    const itens = [];
    for (let volta = 0; volta < MAQUINA_REEL_REPEAT; volta += 1) {
      MAQUINA_ICONES.forEach((src, index) => {
        itens.push(`
          <div class="maquina-icone-item" data-icon-index="${index}">
            <img src="${src}" alt="" aria-hidden="true">
          </div>
        `);
      });
    }
    track.innerHTML = itens.join("");
    track.style.transition = "none";
    track.style.animation = "none";
    track.classList.remove("is-spinning");
  });
}

function normalizarTrackDoIcone(track, targetIndex) {
  const tamanho = obterTamanhoAtualDoReel();
  const offsetNormalizado = -((MAQUINA_ICONES.length + targetIndex) * tamanho);
  track.style.transition = "none";
  track.style.animation = "none";
  track.classList.remove("is-spinning");
  track.style.transform = `translateY(${offsetNormalizado}px)`;
}

function aplicarCombinacaoEstaticaDosIcones(combinacao = maquinaIconesCombinacaoAtual) {
  const tracks = Array.from(document.querySelectorAll(".maquina-icone-track"));
  tracks.forEach((track, index) => {
    normalizarTrackDoIcone(track, combinacao[index] ?? 0);
  });
}

function gerarCombinacaoAleatoriaDosIcones() {
  return Array.from({ length: 3 }, () => Math.floor(Math.random() * MAQUINA_ICONES.length));
}

function inicializarIconesDaMaquina() {
  if (!maquinaIconesInicializados) {
    preencherTracksDosIcones();
    maquinaIconesCombinacaoAtual = gerarCombinacaoAleatoriaDosIcones();
    aplicarCombinacaoEstaticaDosIcones(maquinaIconesCombinacaoAtual);
    maquinaIconesInicializados = true;
    return;
  }

  aplicarCombinacaoEstaticaDosIcones(maquinaIconesCombinacaoAtual);
}

function pausarIconesDaMaquina() {
  if (maquinaIconesTimeout) {
    clearTimeout(maquinaIconesTimeout);
    maquinaIconesTimeout = null;
  }
  maquinaIconesSpinning = false;

  document.querySelectorAll(".maquina-icone-track").forEach((track, index) => {
    const yAtual = obterTranslateYAtual(track);
    track.classList.remove("is-spinning");
    track.style.animation = "none";
    track.style.transition = "none";
    track.style.transform = `translateY(${yAtual}px)`;
    normalizarTrackDoIcone(track, maquinaIconesCombinacaoAtual[index] ?? 0);
  });
}

function colocarTracksParaGirar() {
  const tracks = Array.from(document.querySelectorAll(".maquina-icone-track"));
  tracks.forEach((track) => {
    const yAtual = obterTranslateYAtual(track);
    track.style.transition = "none";
    track.style.transform = `translateY(${yAtual}px)`;
    void track.offsetWidth;
    track.style.animation = "";
    track.classList.add("is-spinning");
  });
  return tracks;
}

function pararReelEmIcone(track, targetIndex, delayMs = 0, duracaoMs = 1320) {
  window.setTimeout(() => {
    const tamanho = obterTamanhoAtualDoReel();
    const currentY = obterTranslateYAtual(track);
    track.classList.remove("is-spinning");
    track.style.animation = "none";
    track.style.transition = "none";
    track.style.transform = `translateY(${currentY}px)`;

    const ciclo = MAQUINA_ICONES.length * tamanho;
    const ajusteBase = ((currentY % ciclo) + ciclo) % ciclo;
    const currentNormalizado = -ajusteBase;
    const destinoNoCiclo = -(targetIndex * tamanho);
    let delta = destinoNoCiclo - currentNormalizado;
    if (delta > 0) delta -= ciclo;
    delta -= ciclo;
    const voltasExtras = ciclo * 0.58;
    const destinoFinal = currentY + delta - voltasExtras;

    requestAnimationFrame(() => {
      track.style.transition = `transform ${duracaoMs}ms cubic-bezier(0.16, 0.84, 0.22, 1)`;
      track.style.transform = `translateY(${destinoFinal}px)`;
    });

    window.setTimeout(() => {
      normalizarTrackDoIcone(track, targetIndex);
    }, duracaoMs + 90);
  }, delayMs);
}

function iniciarGiroContinuoDosIcones() {
  if (!maquinaIconesInicializados) {
    inicializarIconesDaMaquina();
  }

  if (maquinaIconesTimeout) {
    clearTimeout(maquinaIconesTimeout);
    maquinaIconesTimeout = null;
  }

  const tracks = colocarTracksParaGirar();
  if (!tracks.length) return false;

  maquinaIconesSpinning = true;
  return true;
}

function consolidarSorteioDosIcones() {
  if (!maquinaIconesSpinning) return;

  if (maquinaIconesTimeout) {
    clearTimeout(maquinaIconesTimeout);
    maquinaIconesTimeout = null;
  }

  const tracks = Array.from(document.querySelectorAll(".maquina-icone-track"));
  if (!tracks.length) {
    maquinaIconesSpinning = false;
    return;
  }

  const novaCombinacao = gerarCombinacaoAleatoriaDosIcones();

  tracks.forEach((track, index) => {
    pararReelEmIcone(track, novaCombinacao[index], index * 120, 1260 + (index * 120));
  });

  const tempoFinal = 1260 + ((tracks.length - 1) * 120) + 180;
  window.setTimeout(() => {
    maquinaIconesCombinacaoAtual = [...novaCombinacao];
    maquinaIconesSpinning = false;
    aplicarCombinacaoEstaticaDosIcones(maquinaIconesCombinacaoAtual);
  }, tempoFinal);
}

function agendarConsolidacaoDosIcones(delayMs = 3000) {
  if (maquinaIconesTimeout) {
    clearTimeout(maquinaIconesTimeout);
  }

  maquinaIconesTimeout = window.setTimeout(() => {
    maquinaIconesTimeout = null;
    consolidarSorteioDosIcones();
  }, Math.max(0, delayMs));
}

function alternarSorteioDosIconesPorClique() {
  if (sobreAberto) return;
  if (!maquinaIconesInicializados) {
    inicializarIconesDaMaquina();
  }

  if (!maquinaIconesSpinning) {
    const iniciou = iniciarGiroContinuoDosIcones();
    if (!iniciou) return;
    agendarConsolidacaoDosIcones(3000);
    return;
  }

  agendarConsolidacaoDosIcones(3000);
}

window.iniciarIconesDaMaquina = inicializarIconesDaMaquina;
window.pausarIconesDaMaquina = pausarIconesDaMaquina;
window.sortearIconesDaMaquina = alternarSorteioDosIconesPorClique;
window.iniciarGiroContinuoDosIcones = iniciarGiroContinuoDosIcones;

<script id="laforismos-loading-script">
(function () {
  const LOADER_TEXT = 'carregando espasmo';
  const INITIAL_HINT_TEXTS = [
    'pode clicar',
    'clique no box',
    'toca no box'
  ];
  const FOLLOWUP_HINT_SEQUENCES = {
    1: [
      'carregando espasmo',
      'carregando espasmo',
      'vai, clica aí'
    ],
    2: [
      'carregando espasmo',
      'carregando espasmo',
      'num vai clicar?'
    ],
    3: [
      'carregando espasmo',
      'carregando espasmo',
      'você entendeu, né: vai clicando aqui'
    ]
  };
  const FOLLOWUP_HINT_INTERVAL_MS = {
    1: 2200,
    2: 2200,
    3: 3400
  };
  const LOADER_FONT_STACKS = [
    'Arial, Helvetica, sans-serif',
    '"Trebuchet MS", Arial, sans-serif',
    'Verdana, Geneva, sans-serif',
    'Tahoma, Geneva, sans-serif',
    '"Segoe UI", Arial, sans-serif',
    '"Helvetica Neue", Helvetica, Arial, sans-serif',
    'Geneva, Arial, sans-serif',
    '"Times New Roman", Times, serif',
    'Georgia, serif',
    'Garamond, "Times New Roman", serif',
    'Baskerville, "Times New Roman", serif',
    'Palatino, "Palatino Linotype", serif',
    '"Courier New", Courier, monospace',
    'Monaco, "Courier New", monospace',
    'Menlo, Monaco, monospace',
    '"Lucida Console", Monaco, monospace'
  ];

  let primeiraFrasePendente = null;
  let aguardandoPrimeiraFrase = false;
  let apiInicialCarregada = false;
  let loaderFontTimer = null;
  let loaderFontIndex = 0;
  let introHintTimer = null;
  let introHintIndex = 0;
  let followupHintTimer = null;
  let followupHintIndex = 0;

  function obterTotalDeFrasesExibidas() {
    return window.idsExibidos?.size || 0;
  }

  function obterEtapaAtualDeReforco() {
    const totalExibidas = obterTotalDeFrasesExibidas();
    if (totalExibidas >= 1 && totalExibidas <= 3) {
      return totalExibidas;
    }
    return 0;
  }

  function deveUsarHintsDeReforco() {
    return !aguardandoPrimeiraFrase && obterEtapaAtualDeReforco() > 0;
  }

  function obterSequenciaAtualDeReforco() {
    return FOLLOWUP_HINT_SEQUENCES[obterEtapaAtualDeReforco()] || [LOADER_TEXT];
  }

  function obterTextoDoLoaderAtual() {
    if (aguardandoPrimeiraFrase) {
      return INITIAL_HINT_TEXTS[introHintIndex % INITIAL_HINT_TEXTS.length];
    }
    if (deveUsarHintsDeReforco()) {
      const sequenciaAtual = obterSequenciaAtualDeReforco();
      return sequenciaAtual[followupHintIndex % sequenciaAtual.length];
    }
    return LOADER_TEXT;
  }

  function atualizarTextoDoLoader() {
    const texto = obterTextoDoLoaderAtual();
    const track = document.getElementById("readyTrack");
    const backendTrack = document.getElementById("backendLoadingMarquee");
    if (track) track.textContent = texto;
    if (backendTrack) backendTrack.textContent = texto;
  }

  function pararHintsIniciaisDeClique() {
    if (introHintTimer) {
      clearInterval(introHintTimer);
      introHintTimer = null;
    }
    introHintIndex = 0;
    atualizarTextoDoLoader();
  }

  function pararHintsDeReforco() {
    if (followupHintTimer) {
      clearInterval(followupHintTimer);
      followupHintTimer = null;
    }
    followupHintIndex = 0;
    atualizarTextoDoLoader();
  }

  function iniciarHintsDeReforco() {
    if (!deveUsarHintsDeReforco()) {
      pararHintsDeReforco();
      return;
    }

    atualizarTextoDoLoader();

    if (followupHintTimer) return;

    const etapaAtual = obterEtapaAtualDeReforco();
    const intervaloAtual = FOLLOWUP_HINT_INTERVAL_MS[etapaAtual] || 2200;

    followupHintTimer = setInterval(() => {
      if (!deveUsarHintsDeReforco()) {
        pararHintsDeReforco();
        return;
      }
      const sequenciaAtual = obterSequenciaAtualDeReforco();
      followupHintIndex = (followupHintIndex + 1) % sequenciaAtual.length;
      atualizarTextoDoLoader();
    }, intervaloAtual);
  }

  function iniciarHintsIniciaisDeClique() {
    if (!aguardandoPrimeiraFrase) {
      pararHintsIniciaisDeClique();
      return;
    }

    pararHintsDeReforco();

    if (typeof window.ativarModoInicialDeClique === "function") {
      window.ativarModoInicialDeClique();
    }

    atualizarTextoDoLoader();

    if (introHintTimer) return;

    introHintTimer = setInterval(() => {
      if (!aguardandoPrimeiraFrase) {
        pararHintsIniciaisDeClique();
        return;
      }
      introHintIndex = (introHintIndex + 1) % INITIAL_HINT_TEXTS.length;
      atualizarTextoDoLoader();
    }, 1450);
  }

  function garantirCamadasDeLoading() {
    const overlay = document.querySelector("#box .overlay");
    if (!overlay) return;

    if (!overlay.querySelector(".backend-loading-layer")) {
      const backend = document.createElement("div");
      backend.className = "backend-loading-layer";
      backend.innerHTML = `
        <div class="backend-loading-shell">
          <div class="backend-loading-fill" id="backendLoadingFill">
            <div class="backend-loading-marquee" id="backendLoadingMarquee">${LOADER_TEXT}</div>
          </div>
        </div>
      `;
      overlay.prepend(backend);
    }

    if (!overlay.querySelector(".ready-loading-layer")) {
      const ready = document.createElement("div");
      ready.className = "ready-loading-layer";
      ready.innerHTML = `
        <div class="ready-track" id="readyTrack">${LOADER_TEXT}</div>
      `;
      overlay.appendChild(ready);
    }

    atualizarTextoDoLoader();
  }

  function limparClassesDeLoading() {
    const box = document.getElementById("box");
    if (!box) return;
    box.classList.remove("backend-waiting", "backend-ready");
  }

  function aplicarFonteAtualDoLoader() {
    const fonte = LOADER_FONT_STACKS[loaderFontIndex % LOADER_FONT_STACKS.length];
    const track = document.getElementById("readyTrack");
    const backendTrack = document.getElementById("backendLoadingMarquee");

    if (track) track.style.fontFamily = fonte;
    if (backendTrack) backendTrack.style.fontFamily = fonte;
  }

  function pararEspasmoTipografico() {
    if (loaderFontTimer) {
      clearInterval(loaderFontTimer);
      loaderFontTimer = null;
    }
  }

  function iniciarEspasmoTipografico() {
    aplicarFonteAtualDoLoader();
    if (loaderFontTimer) return;

    loaderFontTimer = setInterval(() => {
      loaderFontIndex = (loaderFontIndex + 1) % LOADER_FONT_STACKS.length;
      aplicarFonteAtualDoLoader();
    }, 120);
  }

  window.iniciarEspasmoTipografico = iniciarEspasmoTipografico;
  window.pararEspasmoTipografico = pararEspasmoTipografico;

  function resetarAnimacaoDoLoaderTexto() {
    const track = document.getElementById("readyTrack");
    const backendTrack = document.getElementById("backendLoadingMarquee");

    if (track) {
      track.classList.remove("is-sliding-in");
      track.style.opacity = "1";
      track.style.left = "50%";
      track.style.transform = "translate(-50%, -50%)";
    }

    if (backendTrack) {
      backendTrack.classList.remove("is-sliding-in");
      backendTrack.style.left = "50%";
      backendTrack.style.transform = "translate(-50%, -50%)";
      void backendTrack.offsetWidth;
    }

    aplicarFonteAtualDoLoader();
  }

  function animarEntradaIndependenteDoLoader() {
    const backendTrack = document.getElementById("backendLoadingMarquee");
    if (!backendTrack) return;
    resetarAnimacaoDoLoaderTexto();
    iniciarEspasmoTipografico();
  }

  function ativarLoadingBackendInicial() {
    const box = document.getElementById("box");
    const frase = document.getElementById("frase");
    if (!box || !frase) return;

    garantirCamadasDeLoading();
    limparClassesDeLoading();
    box.classList.add("is-loading", "backend-waiting");
    box.classList.remove("disable-hover");
    frase.innerHTML = "";
    frase.classList.remove("dialogo");
    atualizarTextoDoLoader();

    if (typeof window.pararGlitchDaMaquina === "function") {
      window.pararGlitchDaMaquina();
    }
    document.body.classList.remove("machine-settle");
    animarEntradaIndependenteDoLoader();
  }


  function ativarLoadingProntoParaClique() {
    const box = document.getElementById("box");
    const track = document.getElementById("readyTrack");
    if (!box) return;

    garantirCamadasDeLoading();
    limparClassesDeLoading();
    box.classList.add("is-loading", "backend-ready");
    box.classList.remove("disable-hover");

    if (track) {
      track.style.opacity = "1";
      track.style.left = "50%";
      track.style.transform = "translate(-50%, -50%)";
    }

    if (aguardandoPrimeiraFrase) {
      pararHintsDeReforco();
      iniciarHintsIniciaisDeClique();
    } else if (deveUsarHintsDeReforco()) {
      followupHintIndex = 0;
      iniciarHintsDeReforco();
    } else {
      pararHintsDeReforco();
      atualizarTextoDoLoader();
    }

    iniciarEspasmoTipografico();

    if (typeof window.iniciarGlitchDaMaquina === "function") {
      window.iniciarGlitchDaMaquina();
    }
    document.body.classList.remove("machine-settle");
  }

  window.ativarEstadoLoadingBox = function() {
    if (apiInicialCarregada) {
      ativarLoadingProntoParaClique();
    } else {
      ativarLoadingBackendInicial();
    }
  };

  window.desativarEstadoLoadingBox = function() {
    const box = document.getElementById("box");
    if (box) {
      box.classList.remove("is-loading", "backend-waiting", "backend-ready");
    }
    pararHintsIniciaisDeClique();
    pararHintsDeReforco();
    pararEspasmoTipografico();
    resetarAnimacaoDoLoaderTexto();
    if (typeof window.pararGlitchDaMaquina === "function") {
      window.pararGlitchDaMaquina();
    }
  };

  window.iniciar = function() {
    window.acabou = false;
    window.idsExibidos = new Set();
    window.atualizarFrasesFiltradas();
    window.fila = window.embaralhar(window.frasesFiltradas, window.frasesFiltradas.length);

    apiInicialCarregada = true;

    if (window.fila.length > 0) {
      primeiraFrasePendente = window.fila.shift();
      aguardandoPrimeiraFrase = true;
      introHintIndex = 0;
      iniciarHintsIniciaisDeClique();
      ativarLoadingProntoParaClique();
      window.logEstadoFila("aguardando primeiro clique");
    } else {
      const mensagemVazia = window.mostrarSoNovas
        ? "Você já viu todas as novas."
        : "Nenhuma frase ativa disponível.";
      window.mostrarMensagem(mensagemVazia);
      window.travarHoverConformeTexto(mensagemVazia);
    }
  };

  function dispararPrimeiraFrasePendente() {
    if (!aguardandoPrimeiraFrase || !primeiraFrasePendente || window.sobreAberto) return false;

    aguardandoPrimeiraFrase = false;
    pararHintsIniciaisDeClique();
    followupHintIndex = 0;
    if (typeof window.desativarModoInicialDeClique === "function") {
      window.desativarModoInicialDeClique();
    }
    const primeira = primeiraFrasePendente;
    primeiraFrasePendente = null;
    window.mostrarFraseObjeto(primeira, 1);
    window.aplicarTravaHoverParaEstadoAtual(primeira, 1, true);
    return true;
  }

  const originalProximaFrase = window.proximaFrase;
  window.proximaFrase = function() {
    if (window.sobreAberto) return;

    if (dispararPrimeiraFrasePendente()) {
      return;
    }

    return originalProximaFrase();
  };

  const boxEl = document.getElementById("box");
  if (boxEl && !boxEl.dataset.loaderClickHooked) {
    boxEl.dataset.loaderClickHooked = "1";
    boxEl.addEventListener("click", function(event) {
      if (!document.getElementById("box")?.classList.contains("is-loading")) return;
      if (!aguardandoPrimeiraFrase || !primeiraFrasePendente) return;
      event.preventDefault();
      event.stopPropagation();
      dispararPrimeiraFrasePendente();
    }, true);
  }

  const maquinaEl = document.getElementById("maquinaTrigger");
  if (maquinaEl && !maquinaEl.dataset.loaderClickHooked) {
    maquinaEl.dataset.loaderClickHooked = "1";
    maquinaEl.addEventListener("click", function(event) {
      if (!document.getElementById("box")?.classList.contains("is-loading")) return;
      if (!aguardandoPrimeiraFrase || !primeiraFrasePendente) return;
      event.preventDefault();
      event.stopPropagation();
      dispararPrimeiraFrasePendente();
    }, true);
  }


  if (boxEl && !boxEl.dataset.loaderHoverHooked) {
    boxEl.dataset.loaderHoverHooked = "1";

    boxEl.addEventListener("mouseenter", function() {
      if (boxEl.classList.contains("hover-preview") && !boxEl.classList.contains("is-loading")) {
        iniciarEspasmoTipografico();
      }
    });

    boxEl.addEventListener("mouseleave", function() {
      if (boxEl.classList.contains("hover-preview") && !boxEl.classList.contains("is-loading")) {
        pararEspasmoTipografico();
        resetarAnimacaoDoLoaderTexto();
      }
    });
  }

  const originalEntrarModoCarregandoTroca = window.entrarModoCarregandoTroca;
  window.entrarModoCarregandoTroca = function() {
    originalEntrarModoCarregandoTroca();
    ativarLoadingProntoParaClique();
  };

  const originalAbrirSobre = window.abrirSobre;
  window.abrirSobre = function() {
    pararEspasmoTipografico();
    pararHintsIniciaisDeClique();
    pararHintsDeReforco();
    if (typeof window.desativarModoInicialDeClique === "function") {
      window.desativarModoInicialDeClique();
    }
    if (typeof window.pararGlitchDaMaquina === "function") {
      window.pararGlitchDaMaquina();
    }
    originalAbrirSobre();
  };

  const originalFecharSobre = window.fecharSobre;
  window.fecharSobre = function(event) {
    originalFecharSobre(event);
    if (document.getElementById("box")?.classList.contains("is-loading")) {
      if (typeof window.iniciarGlitchDaMaquina === "function") {
        window.iniciarGlitchDaMaquina();
      }
      if (typeof window.iniciarLoopDoLoader === "function") {
        window.iniciarLoopDoLoader(true);
      }
    }
  };

  garantirCamadasDeLoading();
  ativarLoadingBackendInicial();
})();
</script>
