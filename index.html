<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAFORISMOS</title>

  <link rel="preload" href="./VIDEOBALAO.mp4" as="video" type="video/mp4">

  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: contrast(1.4) brightness(1.2);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    h1 {
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .box {
      position: relative;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 20px 30px;
      max-width: 90%;
      line-height: 1.4;
      cursor: pointer;
      overflow: hidden;
    }

    .frase {
      transition: opacity 0.3s ease;
      white-space: pre-line;
      display: block;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      box-sizing: border-box;
      text-align: center;
    }

    .frase.dialogo {
      text-align: left !important;
      max-width: 620px;
      padding-left: 24px;
      padding-right: 24px;
      margin-left: auto;
      margin-right: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: white;
      color: black;
      display: flex;
      align-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .track {
      display: flex;
      white-space: nowrap;
      animation: scroll 8s linear infinite;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: lowercase;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .box:hover .overlay {
      opacity: 1;
    }

    .box:hover .frase {
      opacity: 0;
    }

    .box.disable-hover:hover .overlay {
      opacity: 0;
    }

    .box.disable-hover:hover .frase {
      opacity: 1;
    }

    .box:hover .track {
      animation-duration: 6.4s;
    }

    .filtro-obceno {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .filtro-obceno-titulo {
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .toggle-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toggle-btn {
      position: relative;
      width: 78px;
      height: 26px;
      border: 1px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.22);
      padding: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      backdrop-filter: blur(3px);
    }

    .toggle-btn::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      transition: transform 0.25s ease;
    }

    .toggle-btn.on::after {
      transform: translateX(48px);
    }

    .toggle-labels {
      width: 78px;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 1px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      position: relative;
      z-index: 1;
    }

    footer span {
      cursor: pointer;
      margin: 0 6px;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        background: url("./balaocolor.png") no-repeat center center;
        background-size: cover;
      }

      #bg-video {
        display: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: -1;
      }

      .box {
        padding: 18px 20px;
      }
    }
  </style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="./VIDEOBALAO.mp4" type="video/mp4">
</video>

<main>
  <h1>LAFORISMOS</h1>

  <div class="box" id="box" onclick="proximaFrase()">
    <div class="frase" id="frase">Carregando frases...</div>

    <div class="overlay">
      <div class="track">
        <span>carregando espasmo • carregando espasmo • carregando espasmo •</span>
        <span>carregando espasmo • carregando espasmo • carregando espasmo •</span>
      </div>
    </div>
  </div>

  <div class="filtro-obceno">
    <div class="filtro-obceno-titulo">Com obcenidades?</div>
    <div class="toggle-area">
      <button id="toggleObceno" class="toggle-btn" type="button" aria-pressed="false" onclick="alternarObceno(event)"></button>
      <div class="toggle-labels">
        <span>SIM</span>
        <span>NÃO</span>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>Pensei, falei ou postei?</div>
  <div>
    <span onclick="wa()">WZ</span> |
    <span onclick="lk()">LKN</span> |
    <span onclick="ig()">IG</span>
  </div>
</footer>

<script>
let mostrarObcenas = false;

document.addEventListener("DOMContentLoaded", () => {
  const botao = document.getElementById("toggleObceno");
  botao.classList.toggle("on", mostrarObcenas);
});
</script>

</body>
</html>
